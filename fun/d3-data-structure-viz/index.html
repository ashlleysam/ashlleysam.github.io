<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data Structure Playground</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="main.js?v=3"></script>
</head>
<body class="playground-shell">
    <header class="playground-header">
        <div>
            <p class="eyebrow">D3 data structures</p>
            <h1>Data Structure Playground</h1>
        </div>
        <nav class="structure-nav" aria-label="Choose a data structure">
            <button type="button" class="structure-tab" data-view="binarytree">Binary tree</button>
            <button type="button" class="structure-tab" data-view="graph">Graph</button>
            <button type="button" class="structure-tab" data-view="btree">B-tree</button>
        </nav>
    </header>
    <main class="playground-main">
        <iframe id="structure-frame" title="Data structure editor"></iframe>
    </main>
    <button type="button" id="fullscreen-button" aria-label="Enter fullscreen" data-tooltip="Enter fullscreen">&#x26F6;</button>
</body>
</html>
